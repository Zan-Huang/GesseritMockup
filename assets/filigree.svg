<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    White vine tracery for the ground of the illuminated initial. The motif is
    one corner scroll repeated on all four quarters, which keeps the middle of
    the panel clear so the letter stays legible.
  -->
  <defs>
    <g id="corner" fill="none" stroke="#f4ebd4" stroke-width="1.5" stroke-linecap="round">
      <path d="M7 33 C7 17 17 7 33 7" />
      <path d="M33 7 C24 12 20 21 24 28 C27 33 34 32 34 26 C34 21 29 20 27 24" />
      <path d="M7 33 C13 26 21 24 27 28" />
      <path d="M17 10 C19 16 18 22 14 25" />
      <path d="M10 17 C16 19 22 18 25 14" />
    </g>
    <g id="cornerDots" fill="#f4ebd4">
      <circle cx="34" cy="26" r="1.5" />
      <circle cx="12" cy="12" r="1.7" />
    </g>
  </defs>

  <g opacity="0.66">
    <use href="#corner" />
    <use href="#corner" transform="rotate(90 50 50)" />
    <use href="#corner" transform="rotate(180 50 50)" />
    <use href="#corner" transform="rotate(270 50 50)" />
  </g>
  <g opacity="0.5">
    <use href="#cornerDots" />
    <use href="#cornerDots" transform="rotate(90 50 50)" />
    <use href="#cornerDots" transform="rotate(180 50 50)" />
    <use href="#cornerDots" transform="rotate(270 50 50)" />
  </g>
  <g fill="#c9a227" opacity="0.55">
    <circle cx="50" cy="6" r="2.2" />
    <circle cx="50" cy="94" r="2.2" />
    <circle cx="6" cy="50" r="2.2" />
    <circle cx="94" cy="50" r="2.2" />
  </g>
</svg>
