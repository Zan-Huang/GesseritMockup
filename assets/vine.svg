<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 400" width="140" height="400">
  <!--
    Tileable manuscript vine. The stem enters at (70,0) and leaves at (70,400)
    with matching tangents, so the border repeats seamlessly at any height. The
    two halves carry different ornaments (roundel above, lozenge below) so the
    repetition is harder to read.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e6a8" />
      <stop offset="0.42" stop-color="#c9a227" />
      <stop offset="1" stop-color="#83621b" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d488" />
      <stop offset="1" stop-color="#9c7a1e" />
    </linearGradient>
    <linearGradient id="verdigris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82a058" />
      <stop offset="1" stop-color="#2f4a24" />
    </linearGradient>
    <linearGradient id="lapis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b6fa8" />
      <stop offset="1" stop-color="#1b3160" />
    </linearGradient>
    <linearGradient id="vermilion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cd5a37" />
      <stop offset="1" stop-color="#8d2413" />
    </linearGradient>

    <path id="acanthus"
      d="M0 0
         C 7 -11 18 -19 34 -24
         C 26 -15 23 -7 29 -1
         C 21 3 13 4 7 2
         C 13 7 21 10 29 10
         C 19 16 6 12 0 0 Z" />
    <path id="sprig"
      d="M0 0
         C 5 -8 13 -14 24 -17
         C 18 -9 17 -3 21 2
         C 13 6 5 5 0 0 Z" />
    <path id="bud"
      d="M0 0
         C -7 -5 -7 -15 0 -19
         C 7 -15 7 -5 0 0 Z" />

    <!-- a full leaf cluster: acanthus with a highlight and a small sprig -->
    <g id="clusterGreen">
      <use href="#acanthus" fill="url(#verdigris)" stroke="#2b4020" stroke-width="1.1" />
      <use href="#acanthus" fill="#ffffff" opacity="0.17" transform="scale(0.62)" />
    </g>
    <g id="clusterBlue">
      <use href="#acanthus" fill="url(#lapis)" stroke="#152a52" stroke-width="1.1" />
      <use href="#acanthus" fill="#ffffff" opacity="0.17" transform="scale(0.62)" />
    </g>
    <g id="clusterRed">
      <use href="#acanthus" fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="1.1" />
      <use href="#acanthus" fill="#ffffff" opacity="0.17" transform="scale(0.62)" />
    </g>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- stem: ink underdrawing, gilt spine, pale highlight -->
    <path d="M70 0 C100 75 40 125 70 200 C100 275 40 325 70 400"
      fill="none" stroke="#40301a" stroke-width="8.6" opacity="0.55" />
    <path d="M70 0 C100 75 40 125 70 200 C100 275 40 325 70 400"
      fill="none" stroke="url(#gold)" stroke-width="4.8" />
    <path d="M70 0 C100 75 40 125 70 200 C100 275 40 325 70 400"
      fill="none" stroke="#f7ecc4" stroke-width="1" opacity="0.5" />

    <!-- curling tendrils -->
    <g fill="none" stroke="#6b5326" stroke-width="1.7">
      <path d="M78 52 C93 47 102 56 98 67 C95 75 86 75 85 67 C84 61 90 59 93 63" />
      <path d="M62 148 C47 143 38 152 42 163 C45 171 54 171 55 163 C56 157 50 155 47 159" />
      <path d="M78 252 C93 247 102 256 98 267 C95 275 86 275 85 267 C84 261 90 259 93 263" />
      <path d="M62 348 C47 343 38 352 42 363 C45 371 54 371 55 363 C56 357 50 355 47 359" />
      <path d="M74 24 C84 20 90 26 88 33" />
      <path d="M66 376 C56 372 50 378 52 385" />
    </g>

    <!-- node 1: right-hand cluster -->
    <g transform="translate(78 52) rotate(-26)">
      <use href="#clusterGreen" />
    </g>
    <g transform="translate(73 68) rotate(40) scale(0.82)">
      <use href="#sprig" fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="1.1" />
    </g>
    <g transform="translate(80 34) rotate(-58) scale(0.6)">
      <use href="#sprig" fill="url(#verdigris)" stroke="#2b4020" stroke-width="1.2" />
    </g>

    <!-- node 2: gilt roundel on lapis with a pearl quatrefoil -->
    <g transform="translate(70 100)">
      <circle r="18" fill="url(#lapis)" stroke="url(#goldRim)" stroke-width="3.8" />
      <circle r="18" fill="none" stroke="#2a1d0c" stroke-width="0.8" opacity="0.5" />
      <g fill="#f4ead0" opacity="0.92">
        <circle cx="0" cy="-8" r="3.2" />
        <circle cx="8" cy="0" r="3.2" />
        <circle cx="0" cy="8" r="3.2" />
        <circle cx="-8" cy="0" r="3.2" />
      </g>
      <circle r="2.8" fill="url(#gold)" />
    </g>
    <g fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="0.9">
      <circle cx="90" cy="88" r="3.4" />
      <circle cx="50" cy="112" r="3.4" />
    </g>

    <!-- node 3: left-hand cluster -->
    <g transform="translate(62 148) rotate(-154) scale(1.05)">
      <use href="#clusterGreen" />
    </g>
    <g transform="translate(67 164) rotate(140) scale(0.82)">
      <use href="#sprig" fill="url(#lapis)" stroke="#152a52" stroke-width="1.1" />
    </g>
    <g transform="translate(60 130) rotate(-122) scale(0.6)">
      <use href="#sprig" fill="url(#verdigris)" stroke="#2b4020" stroke-width="1.2" />
    </g>

    <!-- node 4: bud pair and berries at the waist -->
    <g transform="translate(70 200)">
      <use href="#bud" fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="1" transform="rotate(-24)" />
      <use href="#bud" fill="url(#gold)" stroke="#6b5326" stroke-width="1" transform="rotate(24) scale(0.84)" />
    </g>
    <g fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="0.9">
      <circle cx="85" cy="188" r="3.6" />
      <circle cx="92" cy="197" r="3" />
      <circle cx="55" cy="212" r="3.6" />
      <circle cx="48" cy="203" r="3" />
    </g>

    <!-- node 5: right-hand cluster, blue leaf -->
    <g transform="translate(78 252) rotate(-26)">
      <use href="#clusterBlue" />
    </g>
    <g transform="translate(73 268) rotate(40) scale(0.82)">
      <use href="#sprig" fill="url(#verdigris)" stroke="#2b4020" stroke-width="1.1" />
    </g>
    <g transform="translate(80 234) rotate(-58) scale(0.6)">
      <use href="#sprig" fill="url(#vermilion)" stroke="#6d1b0d" stroke-width="1.2" />
    </g>

    <!-- node 6: lozenge knot on lapis -->
    <g transform="translate(70 300)">
      <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)" rx="3"
        fill="url(#lapis)" stroke="url(#goldRim)" stroke-width="3.4" />
      <path d="M0 -12 L12 0 L0 12 L-12 0 Z" fill="none" stroke="#f4ead0" stroke-width="1.7" opacity="0.85" />
      <circle r="3.2" fill="url(#gold)" />
    </g>
    <g fill="url(#verdigris)" stroke="#2b4020" stroke-width="0.9">
      <circle cx="92" cy="288" r="3.2" />
      <circle cx="48" cy="312" r="3.2" />
    </g>

    <!-- node 7: left-hand cluster, red leaf -->
    <g transform="translate(62 348) rotate(-154) scale(1.05)">
      <use href="#clusterRed" />
    </g>
    <g transform="translate(67 364) rotate(140) scale(0.82)">
      <use href="#sprig" fill="url(#verdigris)" stroke="#2b4020" stroke-width="1.1" />
    </g>
    <g transform="translate(60 330) rotate(-122) scale(0.6)">
      <use href="#sprig" fill="url(#lapis)" stroke="#152a52" stroke-width="1.2" />
    </g>
  </g>
</svg>
