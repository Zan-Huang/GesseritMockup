<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 560" width="140" height="560">
  <!--
    Tileable marginal vine. The stem enters at (70,0) and leaves at (70,560)
    with matching tangents, so it repeats seamlessly at any page height. Palette
    follows the initial: crimson, magenta, lapis, gold and leaf green.
  -->
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fa257" />
      <stop offset="1" stop-color="#426b35" />
    </linearGradient>
    <linearGradient id="greenPale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cb872" />
      <stop offset="1" stop-color="#5c8544" />
    </linearGradient>

    <g id="petals5">
      <ellipse cx="0" cy="-9" rx="5.8" ry="8.6" />
      <ellipse cx="0" cy="-9" rx="5.8" ry="8.6" transform="rotate(72)" />
      <ellipse cx="0" cy="-9" rx="5.8" ry="8.6" transform="rotate(144)" />
      <ellipse cx="0" cy="-9" rx="5.8" ry="8.6" transform="rotate(216)" />
      <ellipse cx="0" cy="-9" rx="5.8" ry="8.6" transform="rotate(288)" />
    </g>

    <g id="leafA">
      <path d="M0 0 C 6 -10 16 -17 30 -19 C 23 -7 13 2 0 0 Z"
        fill="url(#green)" stroke="#3f6b38" stroke-width="1" />
      <path d="M2 -1 C 9 -6 18 -11 27 -17" fill="none" stroke="#3f6b38" stroke-width="0.8" opacity="0.6" />
    </g>
    <g id="leafB">
      <path d="M0 0 C 4 -8 11 -14 22 -16 C 17 -6 10 1 0 0 Z"
        fill="url(#greenPale)" stroke="#3f6b38" stroke-width="0.9" />
      <path d="M2 -1 C 7 -5 13 -9 20 -14" fill="none" stroke="#3f6b38" stroke-width="0.7" opacity="0.55" />
    </g>

    <g id="rosette">
      <g stroke="#a5801d" stroke-width="0.9" fill="#e2c568">
        <circle cx="0" cy="-6" r="4.6" />
        <circle cx="6" cy="0" r="4.6" />
        <circle cx="0" cy="6" r="4.6" />
        <circle cx="-6" cy="0" r="4.6" />
      </g>
      <circle r="2.4" fill="#c9a227" stroke="#a5801d" stroke-width="0.7" />
      <g stroke="#d9bb52" stroke-width="1.1" stroke-linecap="round">
        <path d="M0 -12 v-4" />
        <path d="M12 0 h4" />
        <path d="M0 12 v4" />
        <path d="M-12 0 h-4" />
      </g>
    </g>

    <g id="lily">
      <path d="M0 0 C -8 -8 -11 -20 -8 -31 C -1 -23 3 -11 0 0 Z"
        fill="#3f6fc4" stroke="#22488f" stroke-width="1.1" />
      <path d="M0 0 C 4 -11 2 -23 -3 -31 C 6 -26 12 -12 6 -1 Z"
        fill="#5585d4" stroke="#22488f" stroke-width="1" />
      <path d="M1 1 C 10 -3 20 -2 26 5 C 17 11 6 10 1 1 Z"
        fill="#c8384c" stroke="#8f2038" stroke-width="1.1" />
    </g>

    <g id="bud">
      <path d="M0 0 C -8 -3 -10 -12 -3 -16 C 5 -20 12 -13 9 -5 C 6 0 3 2 0 0 Z" />
    </g>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- the stem -->
    <path d="M70 0 C104 105 36 175 70 280 C104 385 36 455 70 560"
      fill="none" stroke="#5f6f34" stroke-width="3.6" />
    <path d="M70 0 C104 105 36 175 70 280 C104 385 36 455 70 560"
      fill="none" stroke="#8b9d5e" stroke-width="1.3" opacity="0.75" />

    <!-- offshoots carrying the flowers -->
    <g fill="none" stroke="#5f6f34" stroke-width="2">
      <path d="M79 73 C93 68 104 72 108 81" />
      <path d="M60 207 C46 202 35 206 31 215" />
      <path d="M80 353 C93 349 103 354 106 363" />
      <path d="M60 487 C46 483 36 487 32 495" />
    </g>

    <!-- fine gold tendrils -->
    <g fill="none" stroke="#9a8640" stroke-width="1.3">
      <path d="M75 30 C88 26 96 32 95 42 C94 49 87 50 86 44 C85 39 90 37 92 41" />
      <path d="M64 110 C51 108 43 116 46 126 C48 133 56 132 57 125 C58 120 53 118 51 122" />
      <path d="M76 172 C89 172 97 181 93 191 C90 198 83 197 82 191 C81 186 86 184 88 188" />
      <path d="M63 253 C50 253 42 262 46 272 C49 279 56 278 57 272" />
      <path d="M77 310 C90 307 98 314 96 324 C95 331 88 331 87 325 C86 320 91 318 93 322" />
      <path d="M64 396 C51 395 43 403 46 413 C48 420 56 419 57 413" />
      <path d="M78 440 C91 440 98 449 95 458 C92 465 85 464 84 458" />
      <path d="M62 528 C49 528 41 537 45 546" />
      <path d="M72 140 C82 136 90 139 92 146" />
      <path d="M67 420 C57 416 49 419 47 426" />
    </g>

    <!-- leaves -->
    <g>
      <use href="#leafA" transform="translate(77 52) rotate(-40)" />
      <use href="#leafB" transform="translate(68 96) rotate(148) scale(0.9)" />
      <use href="#leafA" transform="translate(60 158) rotate(174) scale(0.88)" />
      <use href="#leafB" transform="translate(63 190) rotate(190) scale(0.78)" />
      <use href="#leafA" transform="translate(66 238) rotate(-14) scale(0.86)" />
      <use href="#leafB" transform="translate(76 288) rotate(-40) scale(0.8)" />
      <use href="#leafA" transform="translate(79 330) rotate(-48) scale(0.9)" />
      <use href="#leafB" transform="translate(72 378) rotate(-28) scale(0.78)" />
      <use href="#leafA" transform="translate(64 438) rotate(158) scale(0.88)" />
      <use href="#leafB" transform="translate(60 470) rotate(182) scale(0.76)" />
      <use href="#leafA" transform="translate(66 512) rotate(-12) scale(0.84)" />
      <use href="#leafB" transform="translate(84 128) rotate(-60) scale(0.72)" />
      <use href="#leafA" transform="translate(52 222) rotate(196) scale(0.68)" />
      <use href="#leafB" transform="translate(86 366) rotate(-64) scale(0.7)" />
      <use href="#leafA" transform="translate(50 500) rotate(200) scale(0.66)" />
    </g>

    <!-- crimson flower on the first offshoot -->
    <g transform="translate(110 83)">
      <g fill="#c8384c" stroke="#8f2038" stroke-width="1.1">
        <use href="#petals5" />
      </g>
      <circle r="3.1" fill="#79162c" />
    </g>

    <!-- gold rosette at the first turn -->
    <use href="#rosette" transform="translate(70 140)" />

    <!-- magenta flower on the left offshoot -->
    <g transform="translate(29 217) rotate(-14)">
      <g fill="#9c2a5e" stroke="#67173d" stroke-width="1.1">
        <use href="#petals5" />
      </g>
      <circle r="3" fill="#4c1029" />
    </g>

    <!-- a small crimson bud between the flowers -->
    <g transform="translate(72 280) rotate(14)">
      <use href="#bud" fill="#c8384c" stroke="#8f2038" stroke-width="1.1" />
    </g>

    <!-- lapis and crimson lily -->
    <use href="#lily" transform="translate(108 366) rotate(12)" />

    <!-- magenta bud at the lower turn -->
    <g transform="translate(70 420) rotate(-8)">
      <use href="#bud" fill="#9c2a5e" stroke="#67173d" stroke-width="1.1" />
    </g>

    <!-- crimson flower at the foot -->
    <g transform="translate(30 496) rotate(10)">
      <g fill="#c8384c" stroke="#8f2038" stroke-width="1.1">
        <use href="#petals5" />
      </g>
      <circle r="3" fill="#79162c" />
    </g>
    <use href="#rosette" transform="translate(92 466) scale(0.78)" />
  </g>
</svg>
