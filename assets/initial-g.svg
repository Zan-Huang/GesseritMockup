<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!--
    Illuminated Lombardic G: gilded strokes with lapis inset panels and a
    flowering vine growing through the counter. Broad-pen weighting, so the
    left stroke is heavy and the top and bottom strokes are fine.
  -->
  <defs>
    <linearGradient id="gold" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#f7e6ab" />
      <stop offset="0.16" stop-color="#eed177" />
      <stop offset="0.38" stop-color="#d5b13f" />
      <stop offset="0.56" stop-color="#eed277" />
      <stop offset="0.74" stop-color="#cea92f" />
      <stop offset="1" stop-color="#b08c1f" />
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f4e0a0" />
      <stop offset="0.4" stop-color="#dcb949" />
      <stop offset="0.75" stop-color="#e9cd72" />
      <stop offset="1" stop-color="#b58f21" />
    </linearGradient>
    <linearGradient id="lapis" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3a63b6" />
      <stop offset="0.5" stop-color="#264a9e" />
      <stop offset="1" stop-color="#1a3478" />
    </linearGradient>

    <!-- brushed gilding: streaky noise multiplied over the strokes -->
    <filter id="brush" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.16" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>

    <!-- the three solid strokes of the letter -->
    <path id="bowl"
      d="M382 97
         A205 200 0 1 0 382 403
         L322 371
         A112 158 0 1 1 322 129
         Z" />
    <path id="flag"
      d="M322 129
         L382 97
         C393 77 405 59 419 49
         C432 56 440 70 439 87
         L434 174
         C392 168 352 150 322 129
         Z" />
    <path id="rightside"
      d="M256 220
         L402 214
         C420 214 432 228 431 248
         L427 390
         C428 412 416 428 397 427
         C381 426 368 418 356 406
         C346 396 334 383 322 371
         L372 332
         L374 277
         L266 281
         C252 277 250 226 256 220
         Z" />

    <clipPath id="letterClip">
      <use href="#bowl" />
      <use href="#flag" />
      <use href="#rightside" />
    </clipPath>

    <!-- pointed lozenge, 120 tall and 34 wide, for the inset panels -->
    <path id="loz"
      d="M0 -60 C 12 -40 17 -19 17 0 C 17 19 12 40 0 60 C -12 40 -17 19 -17 0 C -17 -19 -12 -40 0 -60 Z" />
    <g id="lozTracery" fill="none" stroke="#e6c56a" stroke-width="2.2" stroke-linecap="round">
      <path d="M0 -44 C 9 -30 9 -14 0 0 C -9 14 -9 30 0 44" />
      <circle cx="0" cy="0" r="3.4" fill="#e6c56a" stroke="none" />
      <circle cx="0" cy="-50" r="2.2" fill="#e6c56a" stroke="none" />
      <circle cx="0" cy="50" r="2.2" fill="#e6c56a" stroke="none" />
    </g>

    <g id="petals5">
      <ellipse cx="0" cy="-14" rx="9" ry="13" />
      <ellipse cx="0" cy="-14" rx="9" ry="13" transform="rotate(72)" />
      <ellipse cx="0" cy="-14" rx="9" ry="13" transform="rotate(144)" />
      <ellipse cx="0" cy="-14" rx="9" ry="13" transform="rotate(216)" />
      <ellipse cx="0" cy="-14" rx="9" ry="13" transform="rotate(288)" />
    </g>

    <g id="rosette">
      <g stroke="#a5801d" stroke-width="1.1" fill="#e2c568">
        <circle cx="0" cy="-9" r="6.8" />
        <circle cx="9" cy="0" r="6.8" />
        <circle cx="0" cy="9" r="6.8" />
        <circle cx="-9" cy="0" r="6.8" />
      </g>
      <circle r="3.6" fill="#c9a227" stroke="#a5801d" stroke-width="0.9" />
      <g stroke="#d9bb52" stroke-width="1.5" stroke-linecap="round">
        <path d="M0 -18 v-7" />
        <path d="M18 0 h7" />
        <path d="M0 18 v7" />
        <path d="M-18 0 h-7" />
        <path d="M13 -13 l5 -5" />
        <path d="M13 13 l5 5" />
        <path d="M-13 13 l-5 5" />
        <path d="M-13 -13 l-5 -5" />
      </g>
    </g>

    <path id="leaf" d="M0 0 C 5 -9 14 -15 26 -17 C 20 -6 12 2 0 0 Z" />
  </defs>

  <!-- ================= gilded letter ================= -->
  <g stroke="#9a7717" stroke-width="2.2" stroke-linejoin="round">
    <use href="#bowl" fill="url(#gold)" />
    <use href="#flag" fill="url(#gold)" />
    <use href="#rightside" fill="url(#goldBar)" />
  </g>

  <!-- brush texture, held inside the strokes -->
  <g clip-path="url(#letterClip)" style="mix-blend-mode: multiply">
    <rect width="500" height="500" filter="url(#brush)" opacity="0.2" />
  </g>

  <!-- ================= volutes, drawn as rolled scrolls ================= -->
  <g fill="none" stroke-linecap="round">
    <!-- hanging from the top stroke into the counter -->
    <g>
      <path d="M232 116 C270 102 308 118 310 148 C312 175 289 190 274 177 C261 166 266 149 279 150 C288 151 291 158 287 163"
        stroke="#9a7717" stroke-width="19" />
      <path d="M232 116 C270 102 308 118 310 148 C312 175 289 190 274 177 C261 166 266 149 279 150 C288 151 291 158 287 163"
        stroke="url(#gold)" stroke-width="14.5" />
    </g>
    <!-- the crossbar's inner end, curling under the bar -->
    <g>
      <path d="M268 274 C248 292 252 322 276 330 C296 336 310 324 304 312 C298 302 284 305 286 315"
        stroke="#9a7717" stroke-width="17" />
      <path d="M268 274 C248 292 252 322 276 330 C296 336 310 324 304 312 C298 302 284 305 286 315"
        stroke="url(#gold)" stroke-width="12.5" />
    </g>
    <!-- at the inner foot of the jaw -->
    <g>
      <path d="M372 334 C348 334 334 352 341 369 C347 383 363 383 367 372 C370 363 362 356 355 361"
        stroke="#9a7717" stroke-width="15" />
      <path d="M372 334 C348 334 334 352 341 369 C347 383 363 383 367 372 C370 363 362 356 355 361"
        stroke="url(#gold)" stroke-width="11" />
    </g>
    <!-- small scroll on the outer left edge, between the panels -->
    <g>
      <path d="M58 216 C40 220 33 236 41 248 C50 260 67 256 68 243 C69 234 60 229 54 234"
        stroke="#9a7717" stroke-width="13" />
      <path d="M58 216 C40 220 33 236 41 248 C50 260 67 256 68 243 C69 234 60 229 54 234"
        stroke="url(#gold)" stroke-width="9.5" />
    </g>
  </g>

  <!-- ================= lapis inset panels ================= -->
  <g stroke="#101f4a" stroke-width="1.9">
    <!-- upper left stroke -->
    <g transform="translate(126 148) rotate(37) scale(0.96 1.04)">
      <use href="#loz" fill="url(#lapis)" />
      <use href="#lozTracery" />
    </g>
    <!-- lower left stroke -->
    <g transform="translate(104 320) rotate(-19) scale(0.96 1.2)">
      <use href="#loz" fill="url(#lapis)" />
      <use href="#lozTracery" />
    </g>
    <!-- top-right terminal -->
    <g transform="translate(392 108) rotate(-27) scale(0.8 0.74)">
      <use href="#loz" fill="url(#lapis)" />
      <use href="#lozTracery" />
    </g>
    <!-- the jaw -->
    <g transform="translate(401 340) rotate(-1) scale(0.72 1.16)">
      <use href="#loz" fill="url(#lapis)" />
      <use href="#lozTracery" />
    </g>
    <!-- laid along the crossbar -->
    <g transform="translate(314 248)">
      <path d="M-42 0 C -29 -12 -15 -16 0 -16 C 15 -16 29 -12 42 0 C 29 12 15 16 0 16 C -15 16 -29 12 -42 0 Z"
        fill="url(#lapis)" />
      <g fill="none" stroke="#e6c56a" stroke-width="2.2" stroke-linecap="round">
        <path d="M-29 0 C -21 -7 -10 -7 0 0 C 10 7 21 7 29 0" />
      </g>
      <circle r="2.8" fill="#e6c56a" stroke="none" />
      <circle cx="-34" cy="0" r="1.9" fill="#e6c56a" stroke="none" />
      <circle cx="34" cy="0" r="1.9" fill="#e6c56a" stroke="none" />
    </g>
  </g>

  <!-- ================= flowering vine in the counter ================= -->
  <g>
    <g fill="none" stroke="#5d8a4a" stroke-width="2.4" stroke-linecap="round">
      <path d="M198 392 C180 348 190 296 204 258 C216 226 214 196 210 178" />
      <path d="M204 258 C190 270 176 278 174 288" />
      <path d="M200 326 C212 326 230 330 238 338" />
      <path d="M196 368 C200 378 206 384 210 386" />
    </g>
    <g fill="none" stroke="#bb92aa" stroke-width="1.9" stroke-linecap="round">
      <path d="M210 178 C216 158 226 145 234 141 C242 137 246 143 242 149 C239 154 233 152 234 147" />
    </g>
    <g fill="none" stroke="#c9a227" stroke-width="1.7" stroke-linecap="round">
      <path d="M192 234 C178 230 168 220 168 210" />
      <path d="M228 296 C240 292 248 284 250 276" />
      <path d="M220 378 C234 380 246 384 254 390" />
    </g>

    <g fill="#5d8a4a" stroke="#3c6633" stroke-width="1.2">
      <use href="#leaf" transform="translate(196 316) rotate(150) scale(0.8)" />
      <use href="#leaf" transform="translate(206 284) rotate(-24) scale(0.75)" />
      <use href="#leaf" transform="translate(198 352) rotate(168) scale(0.7)" />
      <use href="#leaf" transform="translate(212 216) rotate(-40) scale(0.66)" />
      <use href="#leaf" transform="translate(202 246) rotate(196) scale(0.64)" />
    </g>

    <!-- crimson flower crowning the stem -->
    <g transform="translate(211 168) scale(0.94)">
      <g fill="#c8384c" stroke="#8f2038" stroke-width="1.5">
        <use href="#petals5" />
      </g>
      <circle r="5" fill="#79162c" />
    </g>

    <!-- dark magenta flower -->
    <g transform="translate(171 288) rotate(18) scale(0.96)">
      <g fill="#9c2a5e" stroke="#67173d" stroke-width="1.5">
        <use href="#petals5" />
      </g>
      <circle r="4.6" fill="#4c1029" />
    </g>

    <!-- blue and red lily -->
    <g transform="translate(238 336) rotate(6) scale(0.88)">
      <path d="M0 0 C -13 -12 -18 -32 -12 -48 C -1 -36 4 -16 0 0 Z"
        fill="#3f6fc4" stroke="#22488f" stroke-width="1.6" />
      <path d="M0 0 C 6 -16 3 -36 -6 -48 C 10 -40 18 -18 10 -2 Z"
        fill="#5585d4" stroke="#22488f" stroke-width="1.4" />
      <path d="M2 2 C 16 -6 32 -3 40 8 C 27 17 10 15 2 2 Z"
        fill="#c8384c" stroke="#8f2038" stroke-width="1.6" />
      <path d="M2 2 C 12 6 20 12 24 20" fill="none" stroke="#8f2038" stroke-width="1.4" />
    </g>

    <!-- magenta bud curling at the foot -->
    <g transform="translate(208 382) scale(0.92)">
      <path d="M0 0 C -12 -4 -16 -18 -6 -24 C 6 -30 18 -20 14 -8 C 11 1 4 4 0 0 Z"
        fill="#9c2a5e" stroke="#67173d" stroke-width="1.5" />
      <path d="M2 -10 C 6 -16 12 -16 14 -11" fill="none" stroke="#d8a8c2" stroke-width="1.5" />
    </g>

    <use href="#rosette" transform="translate(178 208) scale(0.86)" />
    <use href="#rosette" transform="translate(258 386) scale(0.74)" />
  </g>
</svg>
