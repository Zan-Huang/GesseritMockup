<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesserit</title>
    <meta name="description" content="Gesserit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div class="vellum">
      <div class="border border--left" aria-hidden="true">
        <span class="finial finial--head"></span>
        <span class="vine"></span>
        <span class="finial finial--foot"></span>
      </div>
      <div class="border border--right" aria-hidden="true">
        <span class="finial finial--head"></span>
        <span class="vine"></span>
        <span class="finial finial--foot"></span>
      </div>

      <main class="folio">
        <h1 class="wordmark">
          <span class="initial" aria-hidden="true">
            <span class="initial__letter">G</span>
          </span>
          <span class="wordmark__rest">esserit</span>
          <span class="visually-hidden">Gesserit</span>
        </h1>

        <form
          class="subscribe"
          action="https://gesserit.substack.com/api/v1/free"
          method="post"
          target="gesserit-subscribe"
          novalidate
        >
          <label class="visually-hidden" for="email">Email address</label>
          <input
            class="subscribe__field"
            id="email"
            type="email"
            name="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
          />
          <input type="hidden" name="first_url" value="https://gesserit.substack.com/" />
          <input type="hidden" name="first_referrer" value="" />
          <input type="hidden" name="current_url" value="https://gesserit.substack.com/" />
          <input type="hidden" name="current_referrer" value="" />
          <input type="hidden" name="referral_code" value="" />
          <input type="hidden" name="source" value="embed" />
          <button class="subscribe__button" type="submit">Subscribe</button>
          <p class="subscribe__note" role="status" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <iframe name="gesserit-subscribe" title="Subscription" class="sink"></iframe>
    <script src="script.js?v=5"></script>
  </body>
</html>
