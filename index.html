<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesserit</title>
    <meta name="description" content="Gesserit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="page">
      <div class="border border--left" aria-hidden="true">
        <span class="vine-tip"></span>
        <span class="vine"></span>
        <span class="vine-tip vine-tip--foot"></span>
      </div>
      <div class="border border--right" aria-hidden="true">
        <span class="vine-tip"></span>
        <span class="vine"></span>
        <span class="vine-tip vine-tip--foot"></span>
      </div>

      <main class="folio">
        <h1 class="wordmark">
          <!-- Two layers of EB Garamond Initials: F1 is the ornament, F2 the letter -->
          <span class="initial" aria-hidden="true">
            <span class="initial__ornament">G</span>
            <span class="initial__letter">G</span>
          </span>
          <span class="wordmark__rest">esserit</span>
          <span class="visually-hidden">Gesserit</span>
        </h1>
      </main>

      <footer class="colophon">
        <span class="colophon__rule" aria-hidden="true"></span>
        <a
          class="substack"
          href="https://gesserit.substack.com/subscribe"
          target="_blank"
          rel="noopener"
          aria-label="Subscribe to Gesserit on Substack"
        >
          <svg class="substack__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.539 24V10.812H1.46zM22.539 0H1.46v2.836h21.08V0z"
            />
          </svg>
        </a>
        <p class="colophon__lede">Subscribe on Substack</p>
        <p class="colophon__meta">gesserit.substack.com</p>
      </footer>
    </div>
  </body>
</html>
